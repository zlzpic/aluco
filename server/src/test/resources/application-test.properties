# H2 in MySQL compatibility mode for the smoke test (spec 7.4.5, option A)
spring.datasource.url=jdbc:h2:mem:aluco;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# no broker / no offline sweep in tests
aluco.mqtt.enabled=false
aluco.offline.enabled=false

aluco.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789