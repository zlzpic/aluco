version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: aluco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aluco
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
 retries: 20

  emqx:
    image: emqx/emqx:5.8.6
    container_name: aluco-emqx
    environment:
      # v2 spec 5.2.2: EMQX built-in auth, disable anonymous
      EMQX_ALLOW_ANONYMOUS: "false"
      # EMQX API credentials (v2 spec 5.2.3: server bootstraps EMQX via REST API)
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "1883:1883"                  # MQTT
      - "18083:18083"                # Dashboard (admin / public)
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../server
    container_name: aluco-server
    environment:
      ALUCO_DB_URL: jdbc:mysql://mysql:3306/aluco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ALUCO_DB_USER: root
      ALUCO_DB_PASSWORD: root
      ALUCO_MQTT_BROKER: tcp://emqx:1883
      # v2 spec 5.2.2: enable MQTT auth (use device.token as password)
      ALUCO_MQTT_AUTH: ${ALUCO_MQTT_AUTH:-on}
      # EMQX API credentials for device credential sync (v2 spec 5.2.3)
      ALUCO_EMQX_API_USER: admin
      ALUCO_EMQX_API_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # DEMO ONLY — override in any real deployment (README warning).
      ALUCO_JWT_SECRET: aluco-compose-demo-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      emqx:
        condition: service_healthy
    profiles:
      - core
      - demo

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aluco-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server
    profiles:
      - core
      - demo

  grafana:
    image: grafana/grafana:11.3.1
    container_name: aluco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}   # demo only — README warning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles:
      - core
      - demo

  sim:
    build:
      context: ../simulator
    container_name: aluco-sim
    profiles: ["demo"]
    command: >
      --broker tcp://emqx:1883
      --site site-01
      --devices 200
      --interval 1s
      --ramp 30s
      --spike-probability 0.002
      --auth
      --api http://server:8080/api/v1
      --username admin
      --password admin123
    depends_on:
      - server

  # ---- sim-insecure (v1 anonymous mode, for v1-only demo) ----
  sim-insecure:
    build:
      context: ../simulator
    container_name: aluco-sim-insecure
    profiles: ["demo"]
    command: >
      --broker tcp://emqx:1883
      --site site-01
      --devices 50
      --interval 1s
      --ramp 10s
      --spike-probability 0.005
      --auth=false
      --api http://server:8080/api/v1
      --username admin
      --password admin123
    depends_on:
      - server

  # ---- web frontend (pending; uncomment once web/ is built) ----
  # web:
  #   build:
  #     context: ../web
  #   container_name: aluco-web
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - server

volumes:
  mysql-data:
