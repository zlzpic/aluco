# Aluco v1 one-command demo stack (spec chapter 10).
#   core:  docker compose -f deploy/docker-compose.yml up -d
#   demo:  docker compose -f deploy/docker-compose.yml --profile demo up -d
#
# Broker: EMQX 5.8.6 is the spec-pinned default (ADR-0001). To run the whole
# stack on HiveMQ CE instead, comment out the emqx service and uncomment the
# hivemq block below — the server/sim only need a tcp://broker:1883 endpoint.

services:

  mysql:
    image: mysql:8.4
    container_name: aluco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aluco
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.6
    container_name: aluco-emqx
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"   # v1 simplification, see ADR-0003
    ports:
      - "1883:1883"                  # MQTT
      - "18083:18083"                # Dashboard (admin/public — demo only)
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- HiveMQ CE alternative (uncomment to swap the broker) ----
  # hivemq:
  #   image: hivemq/hivemq-ce:2024.8
  #   container_name: aluco-hivemq
  #   ports:
  #     - "1883:1883"
  #     - "8081:8080"                # Control Center (kept off server's 8080)
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  # NOTE: HiveMQ CE allows anonymous connections out of the box.
  # If you swap, point ALUCO_MQTT_BROKER below to tcp://hivemq:1883 and
  # replace "emqx" in server.depends_on accordingly.

  server:
    build:
      context: ../server
    container_name: aluco-server
    environment:
      ALUCO_DB_URL: jdbc:mysql://mysql:3306/aluco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ALUCO_DB_USER: root
      ALUCO_DB_PASSWORD: root
      ALUCO_MQTT_BROKER: tcp://emqx:1883
      # DEMO ONLY — override in any real deployment (README warning).
      ALUCO_JWT_SECRET: aluco-compose-demo-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      emqx:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aluco-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.3.1
    container_name: aluco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # demo only — README warning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  sim:
    build:
      context: ../simulator
    container_name: aluco-sim
    profiles: ["demo"]
    command: >
      --broker tcp://emqx:1883
      --site site-01
      --devices 200
      --interval 1s
      --ramp 30s
      --spike-probability 0.002
      --api http://server:8080/api/v1
      --username admin
      --password admin123
    depends_on:
      - server

  # ---- web frontend (pending; uncomment once web/ is built) ----
  # web:
  #   build:
  #     context: ../web
  #   container_name: aluco-web
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - server

volumes:
  mysql-data: