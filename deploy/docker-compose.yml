# Explicit project name: without it Compose derives "deploy" from this directory,
# which collides with unrelated stacks of the same name and makes --remove-orphans
# dangerous. All resources this file owns are prefixed "aluco_" as a result.
name: aluco

services:

  mysql:
    image: mysql:8.4
    container_name: aluco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ALUCO_DB_PASSWORD:-root}
      MYSQL_DATABASE: aluco
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # host-side debugging only; containers use mysql:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.6
    container_name: aluco-emqx
    environment:
      # v1 demo runs on anonymous MQTT (server ingestor & simulator connect without credentials).
      # Set EMQX_ALLOW_ANONYMOUS=false only if your devices provide deviceKey/token credentials.
      EMQX_ALLOW_ANONYMOUS: "${EMQX_ALLOW_ANONYMOUS:-true}"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "1883:1883"                  # MQTT
      - "18083:18083"                # Dashboard (admin / public)
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../aluco-server
    container_name: aluco-server
    environment:
      ALUCO_DB_URL: jdbc:mysql://mysql:3306/aluco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      ALUCO_DB_USER: root
      ALUCO_DB_PASSWORD: ${ALUCO_DB_PASSWORD:-root}
      ALUCO_MQTT_BROKER: tcp://emqx:1883
      # EMQX REST API credentials for device credential sync (v2 spec 5.2.3)
      ALUCO_EMQX_API_BASE: http://emqx:18083
      ALUCO_EMQX_API_USER: admin
      ALUCO_EMQX_API_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # DEMO ONLY — override in any real deployment (README warning).
      ALUCO_JWT_SECRET: aluco-compose-demo-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
    healthcheck:
      # "container started" is not "REST is serving"; sim and CI both wait on this.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      emqx:
        condition: service_healthy

  web:
    build:
      context: ../aluco-web
    container_name: aluco-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aluco-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.3.1
    container_name: aluco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}   # demo only — README warning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---- simulator (demo profile): seeds 200 devices via REST, then streams telemetry ----
  sim:
    build:
      context: ../aluco-sim
    container_name: aluco-sim
    profiles: ["demo"]
    command: >
      --broker tcp://emqx:1883
      --site site-01
      --devices 200
      --interval 1s
      --ramp 30s
      --spike-probability 0.002
      --api http://server:8080/api/v1
      --username admin
      --password admin123
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
