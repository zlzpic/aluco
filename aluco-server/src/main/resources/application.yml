server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aluco-server
  datasource:
    # rewriteBatchedStatements is required, not a micro-optimisation: without it
    # Connector/J sends JdbcTemplate batches one statement per row (executeBatchSerially),
    # so a 1,000-point telemetry batch costs 1,000 round trips and the sink starves.
    url: ${ALUCO_DB_URL:jdbc:mysql://localhost:3306/aluco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${ALUCO_DB_USER:root}
    password: ${ALUCO_DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        aluco.e2e.latency: true

aluco:
  mqtt:
    enabled: true
    broker: tcp://localhost:1883
    client-id: aluco-server
    telemetry-topic: aluco/+/+/telemetry
    cmdack-topic: aluco/+/+/cmdack
    reconnect-interval-ms: 5000
  sink:
    capacity: 200000
    type: memory
  batch:
    max-size: 1000
    flush-interval-ms: 500
  kafka:
    bootstrap-servers: localhost:9092
  store:
    state: mysql
    timeseries: mysql
  jwt:
    secret: aluco-dev-secret-change-me-in-production-0123456789abcdef
    ttl-hours: 24
  offline:
    enabled: true
    threshold-seconds: 60
    check-interval-ms: 15000
  command:
    enabled: true
    timeout-seconds: 30
    check-interval-ms: 10000
  emqx:
    api:
      base: http://localhost:18083
      user: admin
      password: public