name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly demo smoke, so a green unit-test badge can't hide a broken demo
  workflow_dispatch:   # manual trigger

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile + test (server)
        run: cd aluco-server && ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aluco-web/package-lock.json

      - name: Install dependencies + build
        run: cd aluco-web && npm ci && npm run build

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile (simulator)
        run: cd aluco-sim && mvn -B clean compile

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [ server ]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start the documented one-command demo
        run: |
          cd deploy
          # exactly the command the README promises, simulator included
          docker compose --profile demo up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Server healthy after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Let the fleet ramp up
        run: sleep 60   # sim registers 200 devices, then reports for a minute

      - name: Assert ingestion
        run: |
          curl -sf http://localhost:8080/actuator/prometheus -o /tmp/metrics.txt
          # micrometer counter aluco.ingest.received -> aluco_ingest_received_total{result="..."} <value>
          OK=$(awk '/^aluco_ingest_received_total/ && /result="ok"/ {print $NF}' /tmp/metrics.txt)
          DROPPED=$(awk '/^aluco_ingest_received_total/ && /result="dropped"/ {print $NF}' /tmp/metrics.txt)
          echo "accepted=${OK:-missing} dropped=${DROPPED:-missing}"
          # Summing both labels lets "sim runs but every message is rejected" pass as green.
          [ "${OK%.*}" -gt 0 ] || { echo "no telemetry accepted"; exit 1; }
          [ "${DROPPED%.*}" -eq 0 ] || { echo "$DROPPED messages dropped - devices were never registered"; exit 1; }

      - name: Issue command
        run: |
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/auth/login             -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}')
          [ "$CODE" = "200" ] || { echo "login -> HTTP $CODE: $(cat /tmp/login.json)"; exit 1; }
          CMD_ID=$(curl -s -X POST http://localhost:8080/api/v1/devices/TH-0001/commands/set-interval             -H "Authorization: Bearer $(jq -r .token /tmp/login.json)" -H 'Content-Type: application/json'             -d '{"intervalSec":5}' | tee /tmp/cmd.json | jq -r .cmdId)
          echo "POST set-interval -> $(cat /tmp/cmd.json)"
          case "$CMD_ID" in ''|null) echo "no cmdId in response"; exit 1;; esac
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"

      - name: Await ACKED
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login             -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' | jq -r .token)
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN"               "http://localhost:8080/api/v1/devices/commands/$CMD_ID" | jq -r .status)
            echo "attempt $i: $STATUS"
            if [ "$STATUS" = "ACKED" ]; then exit 0; fi
            sleep 2
          done
          echo "command $CMD_ID never reached ACKED" && exit 1

      - name: Dump containers on failure
        if: failure()
        run: cd deploy && docker compose --profile demo ps && docker compose --profile demo logs --tail=60 server sim

      - name: Teardown
        if: always()
        run: cd deploy && docker compose --profile demo down -v
