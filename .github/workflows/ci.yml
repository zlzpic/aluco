name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'   # weekly demo smoke, so a green unit-test badge can't hide a broken demo
  workflow_dispatch:   # manual trigger

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile + test (server)
        run: cd aluco-server && ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aluco-web/package-lock.json

      - name: Install dependencies + build
        run: cd aluco-web && npm ci && npm run build

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile (simulator)
        run: cd aluco-sim && mvn -B clean compile

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [ server ]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          cd deploy
          docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Server healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Start simulator (demo profile)
        run: |
          cd deploy
          docker compose --profile demo up -d sim
          sleep 60   # give simulator time to seed and send

      - name: Assert ingestion
        run: |
          curl -sf http://localhost:8080/actuator/prometheus -o /tmp/metrics.txt
          # micrometer counter aluco.ingest.received -> aluco_ingest_received_total{result="..."} <value>
          VAL=$(awk '/^aluco_ingest_received_total/ {s += $NF} END {print s+0}' /tmp/metrics.txt)
          echo "aluco_ingest_received_total sum = $VAL"
          if [ "$(echo "$VAL > 0" | bc)" -ne 1 ]; then
            echo "No telemetry ingested" && exit 1
          fi

      - name: Assert command lifecycle (SENT -> ACKED)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | jq -r .token)
          CMD_ID=$(curl -sf -X POST \
            http://localhost:8080/api/v1/devices/TH-0001/commands/set-interval \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"intervalSec":5}' | jq -r .cmdId)
          echo "cmdId=$CMD_ID"
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -H "Authorization: Bearer $TOKEN" \
              "http://localhost:8080/api/v1/devices/commands/$CMD_ID" | jq -r .status)
            echo "attempt $i: $STATUS"
            [ "$STATUS" = "ACKED" ] && exit 0
            sleep 2
          done
          echo "command never reached ACKED (last status: $STATUS)" && exit 1

      - name: Teardown
        if: always()
        run: cd deploy && docker compose down -v
