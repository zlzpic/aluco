name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual trigger

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile + test (server)
        run: cd aluco-server && ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aluco-web/package-lock.json

      - name: Install dependencies + build
        run: cd aluco-web && npm ci && npm run build

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven compile (simulator)
        run: cd aluco-sim && mvn -B clean compile

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [ server ]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          cd deploy
          docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Server healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" && exit 1

      - name: Start simulator (demo profile)
        run: |
          cd deploy
          docker compose --profile demo up -d sim
          sleep 60   # give simulator time to seed and send

      - name: Assert ingestion
        run: |
          METRICS=$(curl -sf http://localhost:8080/actuator/prometheus)
          echo "$METRICS" | grep -E '^aluco_ingest_received' | awk '{print $2}' > /tmp/ingest.txt
          VAL=$(cat /tmp/ingest.txt)
          if [ "$VAL" = "NaN" ] || [ -z "$VAL" ] || [ "$VAL" = "0.0" ]; then
            echo "No telemetry received" && exit 1
          fi
          echo "Ingestion OK: aluco.ingest.received = $VAL"

      - name: Teardown
        if: always()
        run: cd deploy && docker compose down -v
